name: build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra all

      - name: Check documentation build
        if: matrix.python-version == '3.10'
        run: make docs-build

      - name: Test with Pydantic v1
        run: |
          make install-v1
          uv run --no-sync pytest --cov=fastapi_utils

      - name: Restore Pydantic v2
        run: uv sync --locked --extra all --reinstall-package pydantic

      - name: Test with Pydantic v2
        run: |
          uv run --locked --extra all pytest \
            --cov=fastapi_utils \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
