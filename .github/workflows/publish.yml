name: publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish distribution to PyPI"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: pypi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra all

      - name: Test with Pydantic v1
        run: |
          make install-v1
          uv run --no-sync pytest

      - name: Restore Pydantic v2
        run: uv sync --locked --extra all --reinstall-package pydantic

      - name: Test with Pydantic v2
        run: uv run --locked --extra all pytest

      - name: Build distributions
        run: uv build

      - name: Verify distributions
        run: |
          uvx twine check dist/*

      - name: Publish to PyPI
        if: inputs.publish == true
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
