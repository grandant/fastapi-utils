[project]
name = "fastapi-utils"
version = "0.8.0"
description = "Reusable utilities for FastAPI"
readme = "README.md"
requires-python = ">=3.8,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yuval Levi", email = "yuvall9313@gmail.com" },
    { name = "David Montague", email = "davwmont@gmail.com" },
]
keywords = ["fastapi", "OOP", "RESTful"]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "fastapi>=0.89,<0.137",
    "pydantic>1.0,<3.0",
    "psutil>=5,<7",
]

[project.urls]
Homepage = "https://fastapiutils.github.io/fastapi-utils/"
Repository = "https://github.com/grandant/fastapi-utils"
Documentation = "https://fastapiutils.github.io/fastapi-utils/"

[project.optional-dependencies]
all = [
    "sqlalchemy>=1.4,<3.0",
    "pydantic-settings>=2.0.1,<3.0",
    "typing-inspect>=0.9.0,<0.10",
]
session = [
    "sqlalchemy>=1.4,<3.0",
]

[dependency-groups]
dev = [
    # Starlette features
    "aiofiles",
    "httpx",

    # Testing
    "pytest>=7.0,<8.0",
    "pytest-cov",
    "pytest-asyncio>=0.21.1,<0.22; python_version < '3.10'",
    "pytest-asyncio; python_version >= '3.10'",
    "coverage",
    "codecov>=2.1.13,<3.0",
    "pytest-timeout>=2.3.1,<3.0",

    # Documentation
    "mkdocs",
    "mkdocs-material",
    "markdown-include",
    "autoflake>=1.4,<2.0",

    # Static analysis and formatting
    "ruff>0.3",
    "black",
    "mypy",
    "sqlalchemy-stubs",
    "types-setuptools",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fastapi_utils"
module-root = ""

[tool.black]
line-length = 120
target_version = ["py39"]
include = '\.pyi?$'
exclude = '''
(
  /(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | htmlcov
    | build
  )/
)
'''

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["RUF100", "C90", "I"]
isort = { known-first-party = ["fastapi_utils"] }

[tool.coverage.run]
source = ["fastapi_utils"]
branch = true

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise NotImplemented",
    "@overload",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*The explicit passing of coroutine objects to asyncio.wait()*:DeprecationWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy", "sqlmypy"]
follow_imports = "silent"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = true
